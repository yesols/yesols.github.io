- institution: Cedars-Sinai Medical Center
  years: 2015-2018
  courses:
    - title: Oncology Core Curriculum
      role: Lecturer
      details:
        - Review course for nurses seeking oncology certification (OCN).
        - Lectures on carcinogenesis, cancer statistics, and early detection.

    - title: Med-Surg Certification Review
      role: Lecturer
      details:
        - Review course for nurses seeking med-surg certification (CMSRN).
        - Lectures on cardiovascular system disorders and immune system disorders.

    - title: Hematopoietic Stem Cell Transplant Course
      role: Lecturer
      details:
        - Course preparing nurses to administer HSCT/BMT.
        - Lecture on introduction to the immune system.

    - title: Basic Electrocardiography Interpretation and Nursing Management
      role: Instructor
      details:
        - Two-day course for new-graduate RNs in med-surg units, offered 4-5 times a year.
        - Developed course material and exams.
        - Lectures on cardiac electrophysiology, principles of electrocardiography, basic interpretation, and nursing management.

    - title: Chemotherapy Practicum
      role: Instructor
      details:
        - Chemotherapy drugs lecture.
        - Hands-on practicum of administering chemotherapy drugs.

    - title: Medical-Surgical Skills Lab
      role: Facilitator
      details:
        - Refreshers on EKG interpretation, clinical policy and procedures, electronic health record documentation updates, and hyperglycemia protocol.
        - Hands-on training on chest tube management.
        - Code blue simulation.
